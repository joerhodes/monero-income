name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: docker
    env:
      UV_VERSION: "0.11.19"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv --version
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check
      - name: ruff format
        if: success() || failure()
        run: uv run ruff format --check
      - name: mypy
        if: success() || failure()
        run: uv run mypy
      - name: import contracts
        if: success() || failure()
        run: uv run lint-imports
      - name: pytest
        if: success() || failure()
        run: uv run pytest
