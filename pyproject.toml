[project]
name = "monero-income"
version = "0.1.0"
description = "Weekly and monthly income reports from a Monero wallet, valued at historical USD prices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.27.3",
]

[project.scripts]
monero-income = "monero_income.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Only the project's own code: not Spec Kit's scripts or the Python sketches in specs/docs.
extend-exclude = [".specify", "specs", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --cov=monero_income --cov-report=term-missing --cov-fail-under=90"

[tool.importlinter]
root_package = "monero_income"

[[tool.importlinter.contracts]]
name = "Layers: cli > orchestration > primitives"
type = "layers"
layers = [
    "monero_income.cli",
    "monero_income.orchestration",
    "monero_income.primitives",
]

[[tool.importlinter.contracts]]
name = "No skipping: cli must not import primitives directly"
type = "forbidden"
source_modules = ["monero_income.cli"]
forbidden_modules = ["monero_income.primitives"]
# cli reaches primitives only through orchestration; that indirect path is the design.
allow_indirect_imports = true
